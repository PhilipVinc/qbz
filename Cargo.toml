[workspace]
resolver = "2"

members = [
    "crates/qbz-app",
    "crates/qbz-models",
    "crates/qbz-audio",
    "crates/qbz-player",
    "crates/qbz-qobuz",
    "crates/qbz-radio",
    "crates/qbz-core",
    "crates/qbz-integrations",
    "crates/qbz-cache",
    "crates/qbz-library",
    "crates/qbz-cmaf",
    "crates/qbz-dsd",
    "crates/qbz-secrets",
    "crates/qbz-offline-cache",
    "crates/qconnect-core",
    "crates/qconnect-protocol",
    "crates/qconnect-transport-ws",
    "crates/qconnect-app",
    "crates/qbz-credentials",
    "crates/qbz-media-controls",
    "crates/qbz-reco",
    "crates/qbz-log",
    "crates/qbzd",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PhilipVinc/qbz"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "cookies", "stream"] }

# Logging
log = "0.4"
tracing = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto (Qobuz auth)
md-5 = "0.10"
base64 = "0.22"

# Time
chrono = "0.4"

# Regex
regex = "1"

# Audio
symphonia = { version = "0.5", features = ["all"] }

# Random number generation (shuffle / DJ-mix) — mirrors src-tauri pin
rand = "0.10"

# Fuzzy string similarity (track-mix dedup) — mirrors src-tauri pin
strsim = "0.11"

# Note: Linux-specific dependencies (alsa) go in individual crate Cargo.toml files
# because workspace manifests cannot have [target] sections

[profile.release]
# Strip symbol tables from release binaries. Panic backtraces show addresses
# instead of names; the release workflow archives the UNSTRIPPED binary as an
# Actions artifact per tag for offline symbolication.
# Codegen knobs (opt-level / codegen-units / jobs) intentionally stay in the
# workflows' env (CARGO_PROFILE_RELEASE_*) — they are CI-memory tuning, not
# a property of the package.
strip = "symbols"
