[package]
name = "qbz-qobuz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qobuz API client for QBZ"
repository.workspace = true

[dependencies]
qbz-models = { path = "../qbz-models" }
qbz-cmaf = { path = "../qbz-cmaf" }

# Async
tokio = { workspace = true }
futures-util = { workspace = true }

# HTTP
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto (for Qobuz auth)
md-5 = { workspace = true }
base64 = { workspace = true }

# Time
chrono = { workspace = true }

# Filesystem (bundle-token cache location)
dirs = "6"

# Regex
regex = { workspace = true }

# Logging
log = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Used only by examples/lyrics_probe.rs (read-only live probe of the lyrics
# endpoint): loads the saved OAuth token / credentials for login.
qbz-credentials = { path = "../qbz-credentials" }

# Linux-only, for the streamed-download writer: `sync_file_range` to start
# writeback without waiting, and `posix_fadvise(DONTNEED)` to keep a write-once
# track from evicting the PLAYING track's page cache. Neither `nix` nor `rustix`
# wraps `sync_file_range`, so this is the layer that has it.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
