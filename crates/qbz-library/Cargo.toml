[package]
name = "qbz-library"
version.workspace = true
edition.workspace = true
description = "Local music library management for QBZ - scanning, indexing, metadata extraction"
authors = ["blitzkriegfc"]
repository.workspace = true
license.workspace = true

[dependencies]
# Logging
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Filesystem
walkdir = "2"
dirs = "6"

# Audio metadata
lofty = "0.23"
qbz-dsd = { path = "../qbz-dsd" }

# Image processing (thumbnails)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# File system utilities
glob = "0.3"

# UUID generation
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
