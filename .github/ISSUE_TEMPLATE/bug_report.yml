name: Bug report
description: Report something that is not working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Logs make or break a daemon bug report

        muqbzd has no UI to screenshot, so logs are the whole picture. Run the
        daemon in the foreground and capture it:

        ```bash
        qbzd run            # foreground, logs to stdout
        journalctl --user -u qbzd -n 500 --no-pager    # or, if it runs as a service
        ```

        Also useful: `qbzd version`, `qbzd status`, and `curl -s localhost:8182/api/status`.

        Redact nothing but tokens — the daemon already redacts secrets it knows about.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I have attached logs, or explained why I cannot get them.
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I included concrete steps to reproduce.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `qbzd version` (e.g. 2.1.0.moode1).
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host
      description: Board/machine, OS and arch — e.g. "Raspberry Pi 4, moOde 10.3.3, aarch64".
    validations:
      required: true

  - type: input
    id: audio
    attributes:
      label: Audio device and backend
      description: DAC, and the backend/device qbzd is using (e.g. "Topping E30, backend=alsa, device=hw:1,0").
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant log output, or attach a file.
      render: text
    validations:
      required: false
