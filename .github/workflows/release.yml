# muqbzd standalone release.
#
# This is the only workflow that publishes anything:
#   - triggers on `v*` tags (`v2.1.0`);
#   - releases ONLY from `main`: the `guard` job refuses a tag whose commit is
#     not an ancestor of main, so a tag pushed on a topic branch fails loudly
#     instead of publishing a release nobody can reproduce from the trunk;
#   - builds the qbzd binary and ships a stable asset shape consumers pin
#     against: muqbzd-<version>-linux-<arch>.tar.gz containing
#     muqbzd-<version>-linux-<arch>/qbzd, with a .sha256 beside it;
#   - publishes a PRERELEASE GitHub Release on the tag.
#
# Tag `v2.1.0` -> version `2.1.0`. Plain semver: no distro suffixes.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v2.1.0). Empty = build HEAD with the Cargo.toml version, no Release publish."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Releases are cut from main, and only from main. A `qbzd-v*` tag anywhere
  # else (a topic branch, a detached build) stops here before anything is
  # built or published. workflow_dispatch without a tag is a plain test build
  # and is exempt — it publishes nothing.
  guard:
    name: tag must be on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag ref ($REF_NAME) — nothing to publish, skipping the check."
            exit 0
          fi
          git fetch --no-tags --depth=0 origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $REF_NAME points at $GITHUB_SHA, which is not an ancestor of main. Merge to main first, then tag."
            exit 1
          fi
          echo "$REF_NAME ($GITHUB_SHA) is on main."

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            arch: aarch64
          - runner: ubuntu-22.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: release
        run: |
          VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = \"\(.*\)\"/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libssl-dev

      # qbzd must never resolve Slint.
      - name: slint-free dep-graph gate
        run: |
          set -euo pipefail
          hits=$(cargo tree -p qbzd -e normal \
                 | grep -E '\bslint[a-z-]* v' || true)
          [ -z "$hits" ] || { echo "::error::qbzd graph resolves Slint:"; echo "$hits"; exit 1; }

      # QBZD_BUILD_ID stamps the release version into the binary, so
      # `qbzd version`, `--version`, /api/status and the Connect device's
      # softwareVersion all report the released version instead of the bare Cargo
      # version. A four-part id like that is not valid semver and so cannot live
      # in Cargo.toml.
      - name: build
        env:
          QBZD_BUILD_ID: ${{ steps.release.outputs.version }}
        run: cargo build --release -p qbzd

      # Empirical gate: the binary must run on glibc 2.35
      # boxes (Ubuntu 22.04 / Bookworm-era moOde images).
      - name: glibc floor gate (objdump)
        run: |
          set -euo pipefail
          floor=$(objdump -T target/release/qbzd \
                  | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "glibc floor: $floor"
          highest=$(printf '%s\n' "$floor" "GLIBC_2.35" | sort -V | tail -1)
          [ "$highest" = "GLIBC_2.35" ] || { echo "::error::floor $floor exceeds 2.35"; exit 1; }

      # Release asset shape. Consumers pin this, so changing it is a breaking
      # change for them: muqbzd-<version>-linux-<arch>.tar.gz unpacking to a
      # single versioned directory holding the binary, its unit file, shell
      # completions and a README.
      - name: tarball
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cp target/release/qbzd ./qbzd
          DIR="muqbzd-${VERSION}-linux-${ARCH}"
          mkdir -p "staging/${DIR}/completions"
          cp qbzd "staging/${DIR}/qbzd"
          chmod +x "staging/${DIR}/qbzd"
          cp crates/qbzd/service/qbzd.service "staging/${DIR}/qbzd.service"
          ./qbzd completions bash > "staging/${DIR}/completions/qbzd.bash"
          ./qbzd completions zsh  > "staging/${DIR}/completions/qbzd.zsh"
          ./qbzd completions fish > "staging/${DIR}/completions/qbzd.fish"
          cp packaging/linux/muqbzd-standalone-README.md "staging/${DIR}/README.md"
          mkdir -p dist
          tar -czf "dist/${DIR}.tar.gz" -C staging "${DIR}"
          ( cd dist && sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256" )
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: muqbzd-${{ matrix.arch }}
          path: dist/*

  # Single publisher so the two matrix legs never race on Release creation.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/qbzd-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: muqbzd-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
          make_latest: false
          body: |
            muqbzd standalone qbzd daemon build.
