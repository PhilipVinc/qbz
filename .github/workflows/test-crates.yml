# Workspace unit/doc tests for the crates/ tree.
#
# This fork is daemon-only: the Slint UI crates are gone, so the whole
# workspace is testable (~5 min cold, ~1–2 min warm).
#
# Repo policy note: `main` is the trunk and the only branch releases are cut
# from (fork-qbzd-release.yml refuses a tag that is not on main). This is the
# workflow that keeps main green. Path-filtered so packaging/docs PRs skip it.

name: test-crates

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "scripts/cargo-test.sh"
      - ".github/workflows/test-crates.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "scripts/cargo-test.sh"
      - ".github/workflows/test-crates.yml"
  workflow_dispatch:

concurrency:
  group: test-crates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-24.04
    # Cold first run ~5 min (compile + test); warm ~1–2 min. Headroom for
    # registry lag / cache restore.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # qbzd links ALSA / JACK / D-Bus (qbz-audio) and OpenSSL (reqwest).
          # mold matches the release linker for faster test-binary link.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config mold \
            libasound2-dev libjack-jackd2-dev \
            libdbus-1-dev libssl-dev

      # Floating stable is fine here: rust-cache keys on rustc -V, so a stable
      # bump just rebuilds the test cache once.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Manifest is crates/Cargo.toml → artifacts in crates/target.
          workspaces: crates -> target
          shared-key: test-crates-linux
          cache-on-failure: true
          # PRs restore only. Pushes to main write, so the trunk keeps the
          # cache warm for the next PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The tree is rustfmt-clean as of the workspace-wide format; keep it that
      # way. Cheap and fails fast, before the compile.
      - name: cargo fmt --check
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

      - name: cargo test
        env:
          CARGO_TERM_COLOR: always
          CARGO_BUILD_JOBS: "2"
          # Faster link; no -Z flags (stable toolchain).
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          echo "::group::toolchain"
          rustc -V
          cargo -V
          echo "::endgroup::"
          START=$(date +%s)
          ./scripts/cargo-test.sh
          END=$(date +%s)
          echo "cargo test wall time: $((END - START))s"

      # The UI crates are deleted in this fork; the gate stays so a Slint
      # dependency can never re-enter qbzd's graph through a crates.io dep.
      - name: qbzd slint-free dep-graph gate
        run: |
          set -euo pipefail
          hits=$(cargo tree --manifest-path crates/Cargo.toml -p qbzd -e normal \
                 | grep -E '\bslint[a-z-]* v' || true)
          if [ -n "$hits" ]; then
            echo "::error::qbzd graph resolves Slint crates:"; echo "$hits"; exit 1
          fi
