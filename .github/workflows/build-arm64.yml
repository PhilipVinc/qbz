# Helper: build the qbzd binary for aarch64 from any ref, for on-device
# testing. Manual dispatch only — it publishes nothing.
name: build-arm64
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to build"
        required: true
        type: string
jobs:
  build-qbzd:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libssl-dev
      - name: tests (qbzd + models + daemon prefs)
        # qbz-app's shell::tests hit a long-standing reqwest TLS-provider
        # panic that predates this tree, so scope qbz-app to its settings tests.
        run: |
          cargo test -p qbzd -p qbz-models
          cargo test -p qbz-app settings::
      - name: build
        run: cargo build --release -p qbzd
      - uses: actions/upload-artifact@v4
        with: { name: muqbzd-aarch64-testbuild, path: target/release/qbzd }
